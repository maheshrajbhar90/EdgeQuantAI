[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "EdgeQuantAI"
version = "0.1.0"
description = "Technical analysis for equities: TA-Lib indicators, candlestick patterns, signals, support/resistance and LLM-ready prompts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mahesh Kumar" }]
requires-python = ">=3.10"
keywords = ["technical-analysis", "stocks", "ta-lib", "yfinance", "candlestick", "nse", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0,<4",
    "yfinance>=0.2.54,<2",
    "TA-Lib>=0.6,<0.9",
    "requests>=2.28,<3",
    "tabulate>=0.9,<1",
    "openai>=1.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.15,<0.18",
    "mypy>=1.10,<3",
    "pandas-stubs>=2.2",
    "types-requests>=2.31",
    "types-tabulate>=0.9",
    "pre-commit>=3.7,<5",
]

[project.urls]
Homepage = "https://github.com/maheshrajbhar90/EdgeQuantAI"
Issues = "https://github.com/maheshrajbhar90/EdgeQuantAI/issues"
Changelog = "https://github.com/maheshrajbhar90/EdgeQuantAI/blob/main/EdgeQuantAI-main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["stock_analyzer"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_technical_analyzer = ["py.typed"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["tests/legacy"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF", "BLE", "PL", "D", "PT", "RET", "S",
]
ignore = [
    "D203", "D213",      # conflicting docstring layouts; use D211 + D212
    "D107",              # __init__ args are documented in the class docstring (Google style)
    "PLR0913",           # public signatures are fixed by the zero-behaviour-change contract
    "PLR2004",           # constants live in constants.py; remaining literals are tests
    "RUF001", "RUF003",  # prompts intentionally contain typographic characters (–, ✓, ≥)
]

[tool.ruff.lint.per-file-ignores]
# Tests: composite asserts / many params are idiomatic for table-driven checks;
# N813 because the legacy package is literally named EdgeQuantAI.
"tests/**" = ["D", "S101", "PLR0913", "PLR0917", "N802", "N813", "PLC0415", "PT018", "RUF012"]
"tests/fixtures/make_fixture.py" = ["T201"]
"src/EdgeQuantAI/**" = ["N999"]    # legacy package name kept for compatibility
"src/stock_technical_analyzer/_talib.py" = ["E501"]
"src/stock_technical_analyzer/prompts.py" = ["E501"]  # verbatim prompt templates
"main.py" = ["D", "S", "BLE001", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
mypy_path = "src"
packages = ["stock_technical_analyzer"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest / coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = ["--doctest-modules", "--strict-markers", "-ra"]
norecursedirs = ["tests/legacy", "tests/fixtures"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["stock_technical_analyzer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
